name: Build Google Play Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python & Pillow
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Image Processing Tool
        run: pip install pillow

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Production Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias playstore_release_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass AstraSecurePass2026 \
            -keypass AstraSecurePass2026 \
            -dname "CN=AstraStudio, OU=Engineering, O=Astra, L=Taipei, ST=Taiwan, C=TW"

      - name: Sanitize Code & Perfectly Re-encode ic_launcher.png
        run: |
          python3 -c "
          import os, glob, shutil
          from PIL import Image, ImageDraw

          # 1. 建立標準資源與 mipmap 目錄
          res_dirs = [
              'app/src/main/res/mipmap-mdpi',
              'app/src/main/res/mipmap-hdpi',
              'app/src/main/res/mipmap-xhdpi',
              'app/src/main/res/mipmap-xxhdpi',
              'app/src/main/res/mipmap-xxxhdpi',
              'app/src/main/res/drawable',
              'app/src/main/res/values'
          ]
          for d in res_dirs:
              os.makedirs(d, exist_ok=True)

          # 2. 尋找使用者上傳的 ic_launcher.png
          icon_candidates = glob.glob('**/ic_launcher.png', recursive=True)
          user_icon_path = icon_candidates[0] if icon_candidates else None

          base_img = None
          if user_icon_path and os.path.exists(user_icon_path):
              try:
                  with Image.open(user_icon_path) as img:
                      base_img = img.convert('RGBA')
                      print(f'成功讀取原始圖示: {user_icon_path}')
              except Exception as e:
                  print(f'讀取原始圖片異常 ({e})，轉為動態重建高畫質圖標')

          # 若檔案損毀或不存在，自動產生 512x512 高畫質 Astra 品牌圖標
          if base_img is None:
              base_img = Image.new('RGBA', (512, 512), (11, 17, 32, 255))
              draw = ImageDraw.Draw(base_img)
              draw.ellipse((32, 32, 480, 480), outline=(56, 189, 248, 255), width=24)
              draw.ellipse((160, 160, 352, 352), fill=(37, 99, 235, 255))

          # 3. 輸出符合 AAPT2 規範的標準無損 PNG 至各級 mipmap
          sizes = {
              'app/src/main/res/mipmap-mdpi/ic_launcher.png': (48, 48),
              'app/src/main/res/mipmap-hdpi/ic_launcher.png': (72, 72),
              'app/src/main/res/mipmap-xhdpi/ic_launcher.png': (96, 96),
              'app/src/main/res/mipmap-xxhdpi/ic_launcher.png': (144, 144),
              'app/src/main/res/mipmap-xxxhdpi/ic_launcher.png': (192, 192),
              'app/src/main/res/drawable/ic_launcher.png': (192, 192)
          }

          for path, size in sizes.items():
              resized = base_img.resize(size, Image.Resampling.LANCZOS)
              resized.save(path, format='PNG', optimize=False)

          # 4. 確保 MainActivity.java 放置於正確套件目錄
          target_java_dir = 'app/src/main/java/com/slot/assistant'
          os.makedirs(target_java_dir, exist_ok=True)
          target_main = os.path.join(target_java_dir, 'MainActivity.java')
          if not os.path.exists(target_main):
              candidates = [f for f in glob.glob('**/MainActivity.java', recursive=True) if f != target_main]
              if candidates:
                  shutil.copyfile(candidates[0], target_main)

          if os.path.exists('MainActivity.java'):
              os.remove('MainActivity.java')

          # 5. 生成引用 @mipmap/ic_launcher 的 AndroidManifest.xml
          manifest = '''<?xml version=\"1.0\" encoding=\"utf-8\"?>
          <manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">
              <uses-permission android:name=\"android.permission.INTERNET\" />
              <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />
              <application
                  android:allowBackup=\"true\"
                  android:label=\"@string/app_name\"
                  android:icon=\"@mipmap/ic_launcher\"
                  android:roundIcon=\"@mipmap/ic_launcher\"
                  android:supportsRtl=\"true\"
                  android:theme=\"@style/AppTheme\"
                  android:usesCleartextTraffic=\"true\">
                  <activity
                      android:name=\".MainActivity\"
                      android:exported=\"true\"
                      android:windowSoftInputMode=\"adjustResize\"
                      android:configChanges=\"orientation|screenSize\">
                      <intent-filter>
                          <action android:name=\"android.intent.action.MAIN\" />
                          <category android:name=\"android.intent.category.LAUNCHER\" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>'''
          with open('app/src/main/AndroidManifest.xml', 'w', encoding='utf-8') as f:
              f.write('\n'.join([line.strip() for line in manifest.strip().splitlines()]))

          # 6. 生成 values 資源
          strings_xml = '''<?xml version=\"1.0\" encoding=\"utf-8\"?>
          <resources>
              <string name=\"app_name\">Astra Assistant</string>
          </resources>'''
          with open('app/src/main/res/values/strings.xml', 'w', encoding='utf-8') as f:
              f.write('\n'.join([line.strip() for line in strings_xml.strip().splitlines()]))

          styles_xml = '''<?xml version=\"1.0\" encoding=\"utf-8\"?>
          <resources>
              <style name=\"AppTheme\" parent=\"Theme.AppCompat.NoActionBar\">
                  <item name=\"android:windowBackground\">@android:color/black</item>
              </style>
          </resources>'''
          with open('app/src/main/res/values/styles.xml', 'w', encoding='utf-8') as f:
              f.write('\n'.join([line.strip() for line in styles_xml.strip().splitlines()]))

          # 7. 生成 Gradle 基礎設定檔
          settings_gradle = '''pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = \"SlotAssistant\"
          include ':app'
          '''
          with open('settings.gradle', 'w', encoding='utf-8') as f:
              f.write(settings_gradle.strip())

          with open('build.gradle', 'w', encoding='utf-8') as f:
              f.write(\"plugins { id 'com.android.application' version '8.3.2' apply false }\")

          # 8. 生成 app/build.gradle
          app_build = '''plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.slot.assistant'
              compileSdk 34

              defaultConfig {
                  applicationId \"com.slot.assistant\"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName \"1.0.0\"
              }

              signingConfigs {
                  release {
                      storeFile rootProject.file('release.keystore')
                      storePassword 'AstraSecurePass2026'
                      keyAlias 'playstore_release_key'
                      keyPassword 'AstraSecurePass2026'
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          '''
          with open('app/build.gradle', 'w', encoding='utf-8') as f:
              f.write(app_build.strip())

          with open('gradle.properties', 'w', encoding='utf-8') as f:
              f.write('android.useAndroidX=true\nandroid.nonTransitiveRClass=true\norg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\n')

          with open('app/proguard-rules.pro', 'w', encoding='utf-8') as f:
              f.write('# Release rules\n')
          "

      - name: Build Official Google Play AAB and Signed APK
        run: |
          gradle bundleRelease assembleRelease

      - name: Upload Google Play AAB Bundle (上架專用)
        uses: actions/upload-artifact@v4
        with:
          name: GooglePlay-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload Signed Release APK (手機實測專用)
        uses: actions/upload-artifact@v4
        with:
          name: Signed-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      - name: Backup Keystore (永久金鑰備份)
        uses: actions/upload-artifact@v4
        with:
          name: Release-Keystore-Backup
          path: release.keystore
          if-no-files-found: warn

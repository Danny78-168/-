name: build-ios

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Auto-Sanitize Swift Code (自動清洗不可見字元)
        run: |
          python3 -c "
          import os

          path = 'ios/ViewController.swift'
          if os.path.exists(path):
              with open(path, 'rb') as f:
                  data = f.read()

              # 去除 UTF-8 BOM 標頭
              if data.startswith(b'\xef\xbb\xbf'):
                  data = data[3:]

              text = data.decode('utf-8', errors='ignore')

              # 將網頁複製產生的 Non-Breaking Space、零寬字元還原為標準空白
              text = text.replace('\u00a0', ' ')
              text = text.replace('\u202f', ' ')
              text = text.replace('\ufeff', '')
              text = text.replace('\u200b', '')
              text = text.replace('\u200c', '')
              text = text.replace('\u200d', '')
              text = text.replace('\r\n', '\n')

              with open(path, 'w', encoding='utf-8') as f:
                  f.write(text)
              print('ViewController.swift 不可見字元已自動清除乾淨！')
          "

      - name: Compile and Package IPA
        run: |
          mkdir -p build/Payload/AstraAssistant.app
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)

          # 自動補齊 iOS 應用程式啟動入口 (AppDelegate)
          cat << 'EOF' > ios/AppDelegate.swift
          import UIKit

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  window?.rootViewController = ViewController()
                  window?.makeKeyAndVisible()
                  return true
              }
          }
          EOF

          # 編譯 arm64 原生 iOS 執行檔
          swiftc -sdk "$SDK_PATH" \
                 -target arm64-apple-ios15.0 \
                 ios/AppDelegate.swift ios/ViewController.swift \
                 -o build/Payload/AstraAssistant.app/AstraAssistant

          # 生成 Info.plist
          cat << 'EOF' > build/Payload/AstraAssistant.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>AstraAssistant</string>
              <key>CFBundleIdentifier</key>
              <string>com.slot.assistant</string>
              <key>CFBundleName</key>
              <string>Astra Assistant</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UILaunchStoryboardName</key>
              <string>LaunchScreen</string>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

          # 打包為 IPA 格式
          cd build
          zip -qry ../AstraAssistant.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AstraAssistant-iOS-IPA
          path: AstraAssistant.ipa

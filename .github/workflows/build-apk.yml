name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Inject Secrets into Code
        env:
          G_KEY: ${{ secrets.APP_GEMINI_KEY }}
          O_KEY: ${{ secrets.APP_OPENAI_KEY }}
        run: |
          # 自動將 GitHub Secrets 注入到 Java 程式碼中
          if [ -n "$G_KEY" ]; then
            sed -i "s|##INJECT_GEMINI_KEY##|$G_KEY|g" app/src/main/java/com/slot/assistant/MainActivity.java
          fi
          if [ -n "$O_KEY" ]; then
            sed -i "s|##INJECT_OPENAI_KEY##|$O_KEY|g" app/src/main/java/com/slot/assistant/MainActivity.java
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SlotAssistant-Debug
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error

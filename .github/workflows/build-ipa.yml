name: build-ios

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Compile and Package IPA
        run: |
          # 1. 自動深度清洗 ViewController.swift（消除全形空格、span 標籤與特殊字元）
          python3 -c "
          import os, re, unicodedata

          path = 'ios/ViewController.swift'
          if os.path.exists(path):
              with open(path, 'rb') as f:
                  raw = f.read()

              # 移除 UTF-8 / UTF-16 BOM 標頭
              if raw.startswith(b'\xef\xbb\xbf'):
                  raw = raw[3:]
              elif raw.startswith(b'\xff\xfe'):
                  raw = raw.decode('utf-16le').encode('utf-8')
              elif raw.startswith(b'\xfe\xff'):
                  raw = raw.decode('utf-16be').encode('utf-8')

              text = raw.decode('utf-8', errors='ignore')

              # Unicode NFKC 正規化（將全形空格與特殊字元轉為 ASCII）
              text = unicodedata.normalize('NFKC', text)

              # 自動濾除複製貼上夾帶的 [span_...] 與 標籤
              text = re.sub(r'\[span[_\w]*\]\([^\)]*\)', '', text)
              text = re.sub(r'\]*\]', '', text)

              # 清理所有殘留的不可見字元與特殊空格
              text = re.sub(r'[\u00a0\u1680\u180e\u2000-\u200b\u202f\u205f\u3000\ufeff]', ' ', text)
              text = re.sub(r'[\u200b-\u200d\u2060]', '', text)

              # 統一換行符號
              text = text.replace('\r\n', '\n').replace('\r', '\n')

              # 確保類別宣告與首行屬性為純淨 ASCII 語法
              lines = text.split('\n')
              for i, l in enumerate(lines):
                  if 'class ViewController' in l:
                      lines[i] = 'class ViewController: UIViewController, WKNavigationDelegate, WKScriptMessageHandler, UITextFieldDelegate {'
                  elif 'webView' in l and 'WKWebView' in l:
                      lines[i] = '    private var webView: WKWebView!'

              text = '\n'.join(lines)

              with open(path, 'w', encoding='utf-8') as f:
                  f.write(text)
              print('ViewController.swift 標籤與字元已自動清理完畢！')
          "

          mkdir -p build/Payload/AstraAssistant.app
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)

          # 2. 自動補齊 iOS 啟動入口 (AppDelegate)
          cat << 'EOF' > ios/AppDelegate.swift
          import UIKit

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  window?.rootViewController = ViewController()
                  window?.makeKeyAndVisible()
                  return true
              }
          }
          EOF

          # 3. 編譯 arm64 原生二進制檔案（啟用 -parse-as-library 並連結 UIKit、WebKit）
          swiftc -sdk "$SDK_PATH" \
                 -target arm64-apple-ios15.0 \
                 -parse-as-library \
                 -framework UIKit \
                 -framework WebKit \
                 ios/AppDelegate.swift ios/ViewController.swift \
                 -o build/Payload/AstraAssistant.app/AstraAssistant

          # 4. 生成 Info.plist
          cat << 'EOF' > build/Payload/AstraAssistant.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>AstraAssistant</string>
              <key>CFBundleIdentifier</key>
              <string>com.slot.assistant</string>
              <key>CFBundleName</key>
              <string>Astra Assistant</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UILaunchStoryboardName</key>
              <string>LaunchScreen</string>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

          # 5. 打包為 IPA 安裝包
          cd build
          zip -qry ../AstraAssistant.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AstraAssistant-iOS-IPA
          path: AstraAssistant.ipa

name: Build Google Play Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Generate Official Production Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias playstore_release_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass AstraSecurePass2026 \
            -keypass AstraSecurePass2026 \
            -dname "CN=AstraStudio, OU=Engineering, O=Astra, L=Taipei, ST=Taiwan, C=TW"

      - name: Build Google Play AAB & Release APK
        run: |
          ./gradlew bundleRelease assembleRelease --stacktrace

      - name: Sign Google Play Bundle (.aab)
        run: |
          jarsigner -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore release.keystore \
            -storepass AstraSecurePass2026 \
            -keypass AstraSecurePass2026 \
            app/build/outputs/bundle/release/app-release.aab \
            playstore_release_key

      - name: Sign Release APK (.apk)
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            $BUILD_TOOLS_DIR/apksigner sign \
              --ks release.keystore \
              --ks-pass pass:AstraSecurePass2026 \
              --ks-key-alias playstore_release_key \
              --key-pass pass:AstraSecurePass2026 \
              --out app-release-signed.apk \
              app/build/outputs/apk/release/app-release-unsigned.apk
          elif [ -f app/build/outputs/apk/release/app-release.apk ]; then
            $BUILD_TOOLS_DIR/apksigner sign \
              --ks release.keystore \
              --ks-pass pass:AstraSecurePass2026 \
              --ks-key-alias playstore_release_key \
              --key-pass pass:AstraSecurePass2026 \
              --out app-release-signed.apk \
              app/build/outputs/apk/release/app-release.apk
          fi

      - name: Save Production Keystore Artifact (備份金鑰，日後更新 App 必備)
        uses: actions/upload-artifact@v4
        with:
          name: Release-Keystore-Backup
          path: release.keystore
          if-no-files-found: warn

      - name: Upload Google Play AAB Bundle (上架用)
        uses: actions/upload-artifact@v4
        with:
          name: GooglePlay-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload Signed Release APK (手機實測用)
        uses: actions/upload-artifact@v4
        with:
          name: Signed-Release-APK
          path: app-release-signed.apk
          if-no-files-found: warn

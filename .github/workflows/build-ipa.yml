name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Compile and Package IPA
        run: |
          mkdir -p Payload/SlotAssistant.app

          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos swiftc \
            -target arm64-apple-ios15.0 \
            -sdk "$SDK_PATH" \
            -framework UIKit \
            -framework WebKit \
            -framework Foundation \
            ios/AppDelegate.swift \
            ios/ViewController.swift \
            -o Payload/SlotAssistant.app/SlotAssistant

          cp ios/Info.plist Payload/SlotAssistant.app/Info.plist
          codesign -s - --force Payload/SlotAssistant.app
          zip -r SlotAssistant.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SlotAssistant-iOS-IPA
          path: SlotAssistant.ipa
          if-no-files-found: error
          

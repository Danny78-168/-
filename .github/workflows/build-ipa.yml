name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Compile and Package IPA
        run: |
          mkdir -p Payload/SlotAssistant.app

          # 1. 自動過濾手機剪貼簿產生的 NBSP 與隱形零寬字元
          python3 -c "
          import glob
          for f in glob.glob('ios/*.swift'):
              with open(f, 'rb') as fp:
                  data = fp.read()
              data = data.replace(b'\xc2\xa0', b' ')
              for z in [b'\xe2\x80\x8b', b'\xe2\x80\x8c', b'\xe2\x80\x8d', b'\xef\xbb\xbf']:
                  data = data.replace(z, b'')
              with open(f, 'wb') as fp:
                  fp.write(data)
          "

          # 2. 加入 -parse-as-library 支援 @main 原生編譯
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos swiftc \
            -target arm64-apple-ios15.0 \
            -sdk "$SDK_PATH" \
            -parse-as-library \
            -framework UIKit \
            -framework WebKit \
            -framework Foundation \
            ios/AppDelegate.swift \
            ios/ViewController.swift \
            -o Payload/SlotAssistant.app/SlotAssistant

          # 3. 複製設定檔並封裝 IPA
          cp ios/Info.plist Payload/SlotAssistant.app/Info.plist
          codesign -s - --force Payload/SlotAssistant.app
          zip -r SlotAssistant.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SlotAssistant-iOS-IPA
          path: SlotAssistant.ipa
          if-no-files-found: error

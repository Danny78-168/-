<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>蒙地卡羅</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 20px; background: #0f172a; color: #f8fafc; }
    .container { max-width: 900px; margin: 0 auto; }
    .card { background: #1e293b; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 15px; }
    label { font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 5px; }
    input { width: 100%; padding: 8px 12px; background: #334155; border: 1px solid #475569; border-radius: 6px; color: #fff; box-sizing: border-box; }
    button { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
    button:hover { background: #2563eb; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 15px; }
    .stat-item { background: #0f172a; padding: 12px; border-radius: 6px; }
    .stat-val { font-size: 1.25rem; font-weight: bold; color: #38bdf8; margin-top: 4px; }
    canvas { background: #0f172a; border-radius: 8px; padding: 10px; margin-top: 15px; }
  </style>
</head>
<body>
<div class="container">
  <h2>🎰 消除型機台資金流向模擬器 (RTP 96%)</h2>
  
  <div class="card">
    <div class="grid">
      <div>
        <label>初始資金 ($)</label>
        <input type="number" id="bankroll" value="0.95" step="0.05">
      </div>
      <div>
        <label>單注金額 ($)</label>
        <input type="number" id="bet" value="0.10" step="0.01">
      </div>
      <div>
        <label>止盈門檻 ($)</label>
        <input type="number" id="tp" value="2.00" step="0.10">
      </div>
      <div>
        <label>止損門檻 ($)</label>
        <input type="number" id="sl" value="0.30" step="0.05">
      </div>
    </div>
    <button onclick="runSimulation()">開始執行 10,000 次蒙地卡羅模擬</button>

    <div class="stats" id="results" style="display:none;">
      <div class="stat-item"><div>止盈率 (Take Profit)</div><div class="stat-val" id="tpRate">0%</div></div>
      <div class="stat-item"><div>止損率 (Stop Loss)</div><div class="stat-val" id="slRate">0%</div></div>
      <div class="stat-item"><div>直接破產率 (Bust)</div><div class="stat-val" id="bustRate" style="color:#f87171;">0%</div></div>
      <div class="stat-item"><div>平均存活轉數</div><div class="stat-val" id="avgSpins">0</div></div>
    </div>

    <canvas id="chartCanvas" height="120"></canvas>
  </div>
</div>

<script>
let chartInstance = null;

function runSimulation() {
  const bankroll = parseFloat(document.getElementById('bankroll').value);
  const bet = parseFloat(document.getElementById('bet').value);
  const tp = parseFloat(document.getElementById('tp').value);
  const sl = parseFloat(document.getElementById('sl').value);
  const maxSpins = 100;
  const sims = 10000;

  // 離散倍數與累積機率
  const outcomes = [0.0, 0.5, 1.5, 5.0, 25.0, 105.0];
  const cdf = [0.732, 0.882, 0.952, 0.985, 0.997, 1.000];

  let busts = 0, tps = 0, sls = 0, totalSpins = 0;
  let samplePaths = [];

  for (let i = 0; i < sims; i++) {
    let bal = bankroll;
    let spins = 0;
    let path = [bal];

    while (spins < maxSpins) {
      if (bal < bet) { busts++; break; }
      if (bal >= tp) { tps++; break; }
      if (bal <= sl) { sls++; break; }

      bal -= bet;
      const r = Math.random();
      let mult = outcomes[0];
      for (let j = 0; j < cdf.length; j++) {
        if (r <= cdf[j]) { mult = outcomes[j]; break; }
      }
      bal += bet * mult;
      spins++;

      if (i < 20) path.push(Number(bal.toFixed(2)));
    }

    totalSpins += spins;
    if (i < 20) samplePaths.push(path);
  }

  // 顯示統計結果
  document.getElementById('results').style.display = 'grid';
  document.getElementById('tpRate').innerText = ((tps / sims) * 100).toFixed(2) + '%';
  document.getElementById('slRate').innerText = ((sls / sims) * 100).toFixed(2) + '%';
  document.getElementById('bustRate').innerText = ((busts / sims) * 100).toFixed(2) + '%';
  document.getElementById('avgSpins').innerText = (totalSpins / sims).toFixed(1) + ' 轉';

  renderChart(samplePaths, tp, sl);
}

function renderChart(paths, tp, sl) {
  const ctx = document.getElementById('chartCanvas').getContext('2d');
  const maxLen = Math.max(...paths.map(p => p.length));
  const labels = Array.from({length: maxLen}, (_, i) => `第 ${i} 轉`);

  const datasets = paths.map((p, idx) => ({
    label: `路徑 ${idx + 1}`,
    data: p,
    borderColor: `hsl(${idx * 18}, 70%, 60%)`,
    borderWidth: 1.2,
    pointRadius: 0,
    fill: false
  }));

  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { color: '#334155' } },
        y: { grid: { color: '#334155' } }
      }
    }
  });
}
</script>
</body>
</html>

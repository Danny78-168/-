name: Build Google Play Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python & Pillow
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: pip install pillow

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Production Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias playstore_release_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass AstraSecurePass2026 \
            -keypass AstraSecurePass2026 \
            -dname "CN=AstraStudio, OU=Engineering, O=Astra, L=Taipei, ST=Taiwan, C=TW"

      - name: Auto-Sanitize Code, Rebuild Icon & Configure Project
        shell: python
        run: |
          import os, glob, shutil, re
          from PIL import Image, ImageDraw

          # 1. 建立標準專案結構
          os.makedirs('app/src/main/java/com/slot/assistant', exist_ok=True)
          os.makedirs('app/src/main/res/values', exist_ok=True)
          os.makedirs('app/src/main/res/drawable', exist_ok=True)
          for res in ['mipmap-mdpi', 'mipmap-hdpi', 'mipmap-xhdpi', 'mipmap-xxhdpi', 'mipmap-xxxhdpi']:
              os.makedirs(f'app/src/main/res/{res}', exist_ok=True)

          # 2. 自動清洗修復 MainActivity.java（自動剔除中文註解、截斷重複段落、修復網址）
          main_files = glob.glob('**/MainActivity.java', recursive=True)
          if main_files:
              main_files.sort(key=lambda x: os.path.getsize(x), reverse=True)
              target_path = 'app/src/main/java/com/slot/assistant/MainActivity.java'
              with open(main_files[0], 'r', encoding='utf-8', errors='ignore') as f:
                  code = f.read()

              # 僅保留最後一段合法的 package 宣告
              pkg_idx = code.rfind('package com.slot.assistant;')
              if pkg_idx != -1:
                  code = code[pkg_idx:]

              # 截齊至最後一個類別結尾大括號
              brace_idx = code.rfind('}')
              if brace_idx != -1:
                  code = code[:brace_idx + 1]

              # 清洗 markdown 網址標記 [url](url) -> url
              code = re.sub(r'\[(https?://[^\]]+)\]\([^\)]+\)', r'\1', code)
              code = code.replace('"""', '";')
              code = code.replace('\u00a0', ' ')

              with open(target_path, 'w', encoding='utf-8') as f:
                  f.write(code.strip())

              for mf in main_files:
                  if os.path.abspath(mf) != os.path.abspath(target_path) and os.path.exists(mf):
                      os.remove(mf)

          # 3. 保留並無損重構使用者的 ic_launcher.png 圖示
          icon_candidates = glob.glob('**/ic_launcher.png', recursive=True)
          user_icon_path = icon_candidates[0] if icon_candidates else None
          base_img = None
          if user_icon_path and os.path.exists(user_icon_path):
              try:
                  with Image.open(user_icon_path) as img:
                      base_img = img.convert('RGBA')
                      print(f'成功載入自訂圖標: {user_icon_path}')
              except Exception:
                  pass

          if base_img is None:
              base_img = Image.new('RGBA', (512, 512), (11, 17, 32, 255))
              draw = ImageDraw.Draw(base_img)
              draw.ellipse((32, 32, 480, 480), outline=(56, 189, 248, 255), width=24)
              draw.ellipse((160, 160, 352, 352), fill=(37, 99, 235, 255))

          sizes = {
              'app/src/main/res/mipmap-mdpi/ic_launcher.png': (48, 48),
              'app/src/main/res/mipmap-hdpi/ic_launcher.png': (72, 72),
              'app/src/main/res/mipmap-xhdpi/ic_launcher.png': (96, 96),
              'app/src/main/res/mipmap-xxhdpi/ic_launcher.png': (144, 144),
              'app/src/main/res/mipmap-xxxhdpi/ic_launcher.png': (192, 192),
              'app/src/main/res/drawable/ic_launcher.png': (192, 192)
          }
          for path, size in sizes.items():
              resized = base_img.resize(size, Image.Resampling.LANCZOS)
              resized.save(path, format='PNG')

          # 4. 生成標準 AndroidManifest.xml
          manifest = '''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>'''
          with open('app/src/main/AndroidManifest.xml', 'w', encoding='utf-8') as f:
              f.write(manifest.strip())

          # 5. 生成 values 資源
          with open('app/src/main/res/values/strings.xml', 'w', encoding='utf-8') as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="app_name">Astra Assistant</string>\n</resources>')

          with open('app/src/main/res/values/styles.xml', 'w', encoding='utf-8') as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">\n        <item name="android:windowBackground">@android:color/black</item>\n    </style>\n</resources>')

          # 6. 配置標準 Gradle 專案設定
          with open('settings.gradle', 'w', encoding='utf-8') as f:
              f.write("pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\nrootProject.name = 'SlotAssistant'\ninclude ':app'\n")

          with open('build.gradle', 'w', encoding='utf-8') as f:
              f.write("plugins { id 'com.android.application' version '8.3.2' apply false }\n")

          app_build = '''plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.slot.assistant'
              compileSdk 34

              defaultConfig {
                  applicationId "com.slot.assistant"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }

              signingConfigs {
                  release {
                      storeFile rootProject.file('release.keystore')
                      storePassword 'AstraSecurePass2026'
                      keyAlias 'playstore_release_key'
                      keyPassword 'AstraSecurePass2026'
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }'''
          with open('app/build.gradle', 'w', encoding='utf-8') as f:
              f.write(app_build.strip())

          with open('gradle.properties', 'w', encoding='utf-8') as f:
              f.write('android.useAndroidX=true\nandroid.nonTransitiveRClass=true\norg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\n')

          with open('app/proguard-rules.pro', 'w', encoding='utf-8') as f:
              f.write('# Release rules\n')

      - name: Build Official Google Play AAB and Signed APK
        run: |
          gradle bundleRelease assembleRelease

      - name: Upload Google Play AAB Bundle (上架專用)
        uses: actions/upload-artifact@v4
        with:
          name: GooglePlay-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload Signed Release APK (手機實測專用)
        uses: actions/upload-artifact@v4
        with:
          name: Signed-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      - name: Backup Keystore (永久金鑰備份)
        uses: actions/upload-artifact@v4
        with:
          name: Release-Keystore-Backup
          path: release.keystore
          if-no-files-found: warn

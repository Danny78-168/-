name: Build Google Play Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Production Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias playstore_release_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass AstraSecurePass2026 \
            -keypass AstraSecurePass2026 \
            -dname "CN=AstraStudio, OU=Engineering, O=Astra, L=Taipei, ST=Taiwan, C=TW"

      - name: Auto-Configure & Clean Android Project
        run: |
          python3 -c "
          import os, glob, shutil

          # 1. 建立標準專案目錄
          os.makedirs('app/src/main/res/values', exist_ok=True)
          target_java_dir = 'app/src/main/java/com/slot/assistant'
          os.makedirs(target_java_dir, exist_ok=True)

          # 2. 清洗所有 Java 檔案的手機剪貼簿 NBSP 與隱形字元
          for f in glob.glob('**/*.java', recursive=True):
              with open(f, 'rb') as fp:
                  data = fp.read()
              data = data.replace(b'\xc2\xa0', b' ')
              for z in [b'\xe2\x80\x8b', b'\xe2\x80\x8c', b'\xe2\x80\x8d', b'\xef\xbb\xbf']:
                  data = data.replace(z, b'')
              with open(f, 'wb') as fp:
                  fp.write(data)

          # 3. 確保 MainActivity.java 放置於標準套件目錄，並移除根目錄多餘副本
          target_main = os.path.join(target_java_dir, 'MainActivity.java')
          if not os.path.exists(target_main):
              candidates = [f for f in glob.glob('**/MainActivity.java', recursive=True) if f != target_main]
              if candidates:
                  shutil.copyfile(candidates[0], target_main)

          if os.path.exists('MainActivity.java'):
              os.remove('MainActivity.java')

          # 4. 生成無縮排錯誤的 AndroidManifest.xml
          manifest = '''<?xml version=\"1.0\" encoding=\"utf-8\"?>
          <manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">
              <uses-permission android:name=\"android.permission.INTERNET\" />
              <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />
              <application
                  android:allowBackup=\"true\"
                  android:label=\"@string/app_name\"
                  android:supportsRtl=\"true\"
                  android:theme=\"@style/AppTheme\"
                  android:usesCleartextTraffic=\"true\">
                  <activity
                      android:name=\".MainActivity\"
                      android:exported=\"true\"
                      android:windowSoftInputMode=\"adjustResize\"
                      android:configChanges=\"orientation|screenSize\">
                      <intent-filter>
                          <action android:name=\"android.intent.action.MAIN\" />
                          <category android:name=\"android.intent.category.LAUNCHER\" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>'''
          with open('app/src/main/AndroidManifest.xml', 'w', encoding='utf-8') as f:
              f.write('\n'.join([line.strip() for line in manifest.strip().splitlines()]))

          # 5. 生成標準 values 資源檔
          strings_xml = '''<?xml version=\"1.0\" encoding=\"utf-8\"?>
          <resources>
              <string name=\"app_name\">Astra Assistant</string>
          </resources>'''
          with open('app/src/main/res/values/strings.xml', 'w', encoding='utf-8') as f:
              f.write('\n'.join([line.strip() for line in strings_xml.strip().splitlines()]))

          styles_xml = '''<?xml version=\"1.0\" encoding=\"utf-8\"?>
          <resources>
              <style name=\"AppTheme\" parent=\"Theme.AppCompat.NoActionBar\">
                  <item name=\"android:windowBackground\">@android:color/black</item>
              </style>
          </resources>'''
          with open('app/src/main/res/values/styles.xml', 'w', encoding='utf-8') as f:
              f.write('\n'.join([line.strip() for line in styles_xml.strip().splitlines()]))

          # 6. 生成標準 settings.gradle
          settings_gradle = '''pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = \"SlotAssistant\"
          include ':app'
          '''
          with open('settings.gradle', 'w', encoding='utf-8') as f:
              f.write(settings_gradle.strip())

          # 7. 生成根目錄 build.gradle
          root_build = '''plugins {
              id 'com.android.application' version '8.3.2' apply false
          }
          '''
          with open('build.gradle', 'w', encoding='utf-8') as f:
              f.write(root_build.strip())

          # 8. 生成直接綁定簽名與關閉 Lint 阻斷的 app/build.gradle
          app_build = '''plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.slot.assistant'
              compileSdk 34

              defaultConfig {
                  applicationId \"com.slot.assistant\"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName \"1.0.0\"
              }

              signingConfigs {
                  release {
                      storeFile rootProject.file('release.keystore')
                      storePassword 'AstraSecurePass2026'
                      keyAlias 'playstore_release_key'
                      keyPassword 'AstraSecurePass2026'
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          '''
          with open('app/build.gradle', 'w', encoding='utf-8') as f:
              f.write(app_build.strip())

          # 9. 生成必要設定檔
          with open('gradle.properties', 'w', encoding='utf-8') as f:
              f.write('android.useAndroidX=true\nandroid.nonTransitiveRClass=true\norg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\n')

          with open('app/proguard-rules.pro', 'w', encoding='utf-8') as f:
              f.write('# Release proguard rules\n')
          "

      - name: Build Official Google Play AAB and Signed APK
        run: |
          gradle bundleRelease assembleRelease

      - name: Upload Google Play AAB Bundle (上架專用)
        uses: actions/upload-artifact@v4
        with:
          name: GooglePlay-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload Signed Release APK (手機實測專用)
        uses: actions/upload-artifact@v4
        with:
          name: Signed-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      - name: Backup Keystore (永久金鑰備份)
        uses: actions/upload-artifact@v4
        with:
          name: Release-Keystore-Backup
          path: release.keystore
          if-no-files-found: warn
